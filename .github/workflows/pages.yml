name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate static docs
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/.nojekyll
          if find docs \( -iname 'PEERJ_REVIEWER_FAQ.md' -o -iname 'PEERJ_PORTAL_INPUTS.txt' \) | grep -q .; then
            echo 'I7 denylist markdown hit' >&2
            exit 1
          fi
          if [ -d docs/superpowers ]; then
            echo 'I7 docs/superpowers present' >&2
            exit 1
          fi
          if grep -R --include='*.html' --include='*.js' --include='*.css' -F 'github.com/PeterPonyu/HetCLOP' docs; then
            echo 'H8 private HetCLOP href' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("docs")
          html = list(root.rglob("*.html"))
          assert html, "no html"
          rasters = [p for p in root.rglob("*") if p.suffix.lower() in {".png", ".pdf", ".jpg", ".jpeg", ".webp"}]
          assert not rasters, f"unpublished rasters in docs: {rasters}"
          leak = [
              re.compile(r"unpublished results", re.I),
              re.compile(r"\bNMI\b"),
              re.compile(r"\bARI\b"),
              re.compile(r"\bASW\b"),
              re.compile(r"\bDAV\b"),
              re.compile(r"0\.564"),
              re.compile(r"0\.363"),
              re.compile(r"0\.501"),
              re.compile(r"0\.763"),
          ]
          hits = []
          for p in root.rglob("*"):
              if p.suffix.lower() not in {".html", ".txt"}:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              for pat in leak:
                  if pat.search(text):
                      hits.append(f"{p}:{pat.pattern}")
          assert not hits, f"unpublished lock leak in docs: {hits}"
          print(f"ok {len(html)} html files")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
